# Backend pull request checks (spec backend-cicd-pipeline, AC1, AC2, AC16).
# `pull_request` only: never `pull_request_target`. Only the diff job can mint an OIDC token,
# and only for a branch of this repository.
name: backend pr
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/backend-checks.yml
  diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.7.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install the CDK CLI
        run: npm install --global aws-cdk@2.1132.0
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-airadar-diff
          aws-region: us-east-1
          role-session-name: pr-diff-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Mask the chat API id and URL
        shell: bash
        env:
          CHAT_API_ID: ${{ secrets.CHAT_API_ID }}
        run: |
          if [ -n "$CHAT_API_ID" ]; then
            echo "::add-mask::$CHAT_API_ID"
            echo "::add-mask::https://$CHAT_API_ID.execute-api.us-east-1.amazonaws.com"
          fi
      - name: cdk diff of all seven stacks (template comparison, read-only)
        shell: bash
        env:
          CHAT_API_ID: ${{ secrets.CHAT_API_ID }}
        run: |
          {
            echo "## Stack diff (read-only template comparison against the live account)"
            for stack in AiRadarCardStore AiRadarRuntimeRole AiRadarSchedule AiRadarBudget AiRadarFeedApi AiRadarChatRuntime AiRadarChatApi; do
              echo "<details><summary>$stack</summary>"
              echo
              echo '```'
              uv run python -m scripts.ci.cdk diff --method=template --exclusively --no-notices "$stack" 2>&1 | sed "s/${CHAT_API_ID:-__none__}/***/g"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
  diff-skipped:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the skipped diff
        run: |
          echo "diff skipped: fork PRs get no AWS credentials" >> "$GITHUB_STEP_SUMMARY"
