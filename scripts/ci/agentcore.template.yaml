# CI-only AgentCore config template (spec backend-cicd-pipeline, AC6). Rendered in the runner
# by scripts/ci/agentcore_config.py; never the developer's gitignored .bedrock_agentcore.yaml.
# The runtime ids are the two EXISTING runtimes, so `agentcore deploy -a <agent>` updates in
# place and never creates one. `{account_id}` is filled from the execution role ARNs;
# `source_path` and `execution_role` are filled by the renderer.
default_agent: ai_radar_chat
agents:
  ai_radar_curation:
    name: ai_radar_curation
    language: python
    node_version: '20'
    entrypoint: runtime_app.py
    deployment_type: container
    runtime_type: null
    platform: linux/arm64
    container_runtime: docker
    source_path: null
    aws:
      execution_role: null
      execution_role_auto_create: false
      account: '{account_id}'
      region: us-east-1
      ecr_repository: '{account_id}.dkr.ecr.us-east-1.amazonaws.com/bedrock-agentcore-ai_radar_curation'
      ecr_auto_create: false
      s3_path: null
      s3_auto_create: false
      network_configuration:
        network_mode: PUBLIC
        network_mode_config: null
      protocol_configuration:
        server_protocol: HTTP
      observability:
        enabled: true
      lifecycle_configuration:
        idle_runtime_session_timeout: null
        max_lifetime: null
    bedrock_agentcore:
      agent_id: ai_radar_curation-FW1w976PCI
      agent_arn: 'arn:aws:bedrock-agentcore:us-east-1:{account_id}:runtime/ai_radar_curation-FW1w976PCI'
      agent_session_id: null
    memory:
      mode: NO_MEMORY
      memory_id: null
      memory_arn: null
      memory_name: null
      event_expiry_days: 30
      first_invoke_memory_check_done: false
      was_created_by_toolkit: false
    identity:
      credential_providers: []
      workload: null
    aws_jwt:
      enabled: false
      audiences: []
      signing_algorithm: ES384
      issuer_url: null
      duration_seconds: 300
    authorizer_configuration: null
    request_header_configuration: null
    oauth_configuration: null
    api_key_env_var_name: null
    api_key_credential_provider_name: null
    is_generated_by_agentcore_create: false
  ai_radar_chat:
    name: ai_radar_chat
    language: python
    node_version: '20'
    entrypoint: chat_app.py
    deployment_type: container
    runtime_type: null
    platform: linux/arm64
    container_runtime: docker
    source_path: null
    aws:
      execution_role: null
      execution_role_auto_create: false
      account: '{account_id}'
      region: us-east-1
      ecr_repository: '{account_id}.dkr.ecr.us-east-1.amazonaws.com/bedrock-agentcore-ai_radar_chat'
      ecr_auto_create: false
      s3_path: null
      s3_auto_create: false
      network_configuration:
        network_mode: PUBLIC
        network_mode_config: null
      protocol_configuration:
        server_protocol: HTTP
      observability:
        enabled: true
      lifecycle_configuration:
        idle_runtime_session_timeout: null
        max_lifetime: null
    bedrock_agentcore:
      agent_id: ai_radar_chat-JFCO0R9lkT
      agent_arn: 'arn:aws:bedrock-agentcore:us-east-1:{account_id}:runtime/ai_radar_chat-JFCO0R9lkT'
      agent_session_id: null
    memory:
      mode: NO_MEMORY
      memory_id: null
      memory_arn: null
      memory_name: null
      event_expiry_days: 30
      first_invoke_memory_check_done: false
      was_created_by_toolkit: false
    identity:
      credential_providers: []
      workload: null
    aws_jwt:
      enabled: false
      audiences: []
      signing_algorithm: ES384
      issuer_url: null
      duration_seconds: 300
    authorizer_configuration: null
    request_header_configuration: null
    oauth_configuration: null
    api_key_env_var_name: null
    api_key_credential_provider_name: null
    is_generated_by_agentcore_create: false
